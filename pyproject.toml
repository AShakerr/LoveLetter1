[project]
name = "desk"
version = "0.1.0"
description = "Private investment decision journal: data, house views, regime, conviction scores, logged decisions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "tenacity>=8.3",
]

[project.scripts]
desk = "desk.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-socket>=0.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"desk/cli.py" = ["B008"]  # typer.Option in defaults is the typer idiom
