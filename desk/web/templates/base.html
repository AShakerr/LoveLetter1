<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}desk{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">desk <span class="muted">v{{ version }}</span></div>
    <nav>
      <a href="/" class="{% if active == 'tape' %}active{% endif %}">Tape</a>
      <a href="/portfolio" class="{% if active == 'portfolio' %}active{% endif %}">Portfolio</a>
      <a href="/house-views" class="{% if active == 'house' %}active{% endif %}">House views</a>
      <a class="disabled" title="phase 3">Decisions</a>
      <a class="disabled" title="phase 4">Track record</a>
    </nav>
    <div class="clock muted">{{ now.strftime('%a %d %b %Y %H:%M') }} {{ tz }}</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
