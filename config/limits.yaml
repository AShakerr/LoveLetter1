# Position limits (docs/BRIEF.md section 2). Fractions of total portfolio value in EUR.
max_single_position: 0.15
max_single_theme: 0.35
max_illiquid_private: 0.15
min_diversified_core_target: 0.40
min_diversified_core_warn: 0.25
max_crypto: 0.05
# Rules engine defaults (section 8)
stop_loss:
  stock: 0.18
  etf: 0.12
  private: null
max_buy_size_per_decision: 0.05
score_bands: {act: 75, candidate: 60, watch: 45}
review:
  score_decay_points: 15       # score fell by more than this over 30 days
  score_decay_days: 30
  score_floor: 45              # or fell below this
  momentum_sentiment_floor: -0.15
  stale_days: 7
  stale_days_manual: 14
