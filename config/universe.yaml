# ---- daily screener universe (docs/BRIEF.md 8c) -------------------------------------------------
# Constituent lists are refreshed monthly from Wikipedia (desk screener refresh) into `instruments` with
# screener_member set. Revolut's tradable list is not machine-readable: tradable_default says what to assume per
# source; override single names in `tradable_overrides`. Names that drop out of a list are flagged, not deleted.
screener:
  sources: [sp500, stoxx600, safra_focus_list]
  tradable_default: {sp500: true, stoxx600: false, safra_focus_list: true}
  tradable_overrides: {}
  top_n: 15
  anti_churn_days: 3
  sentiment_calls_per_day: 20
