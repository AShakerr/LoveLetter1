# The instrument universe. Synced into the `instruments` table on every run.
# kind: stock | etf | commodity | crypto | private | index | fx
# tradable: true only for things Ahmed can actually buy on Revolut. Never recommend without it.
# source_symbol: the yfinance symbol when it differs from the display ticker.
# price_source: yfinance (default) | none   (private assets have no daily price)
# news_sentiment: true -> Alpha Vantage ticker sentiment is fetched (counts against the 25/day budget)
# composition_confirmed: false -> a pot whose contents are unknown; limit rules only flag until confirmed
# valuation: how f_valuation is computed (docs/BRIEF.md section 7):
