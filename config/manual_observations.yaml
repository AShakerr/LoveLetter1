# Hand-maintained series with no reliable free API (Egypt). Edit values and as_of dates by hand.
# The dashboard paints a series red once as_of is older than 14 days.
# Rows whose note contains PLACEHOLDER are skipped by the fetcher (a placeholder zero is not an observation);
# replace value, as_of and the note with a real reading to activate them.
observations:
  - series: EGX30
    label: EGX30 index
    value: 0
    as_of: 2026-08-15
    unit: pts
    note: "PLACEHOLDER — update from egx.com.eg"
  - series: CBE_DEPOSIT_RATE
    label: CBE overnight deposit rate
    value: 0
    as_of: 2026-08-15
    unit: "%"
    note: "PLACEHOLDER — update from cbe.org.eg"
  # AAII_BULL_BEAR_SPREAD comes from the aaii fetcher (one week per pull) or `desk aaii-backfill`; not a manual series.
  # Median of published sell-side strategist year-end targets; compared with the Safra target (consensus gap).
  - series: "CONSENSUS_TARGET:S&P 500 Dec-26"
    label: Street consensus S&P 500 Dec-26
    value: 0
    as_of: 2026-08-15
    unit: pts
    note: "PLACEHOLDER — median of published strategist targets"
